<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="about.head.title">About Ugrow</title>
    <link rel="icon" href="./public/favicon/favicon.svg" type="image/svg+xml">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="./src/css/root.css">
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="stylesheet" href="./src/css/presentation_layout.css">
</head>
<body>
    <!-- Header Component -->
    <header-component></header-component>
    <main data-cy="about_main-content">
        <!-- Hero About of website -->
        <section class="common_hero">
            <h1 data-i18n="about.hero.title"></h1>
            <p data-i18n="about.hero.subtitle"></p>
        </section>
        <!-- About Section to brings informations about the project -->
        <section id="about" class="common_section">
            <article>
                <h1 data-i18n="about.about.title"></h1>
                <p data-i18n="about.about.description"></p>
            </article>
            <figure>
                <img src="./src/assets/images/content/goal.svg" data-i18n-alt="about.image">
            </figure>
        </section>
        <section id="creator" class="common_section">
            <article>
                <h1 data-i18n="about.creator.title"></h1>
                <p data-i18n="about.creator.description"></p>
            </article>
            <figure>
                <img src="./src/assets/images/content/creator_image.png" data-i18n-alt="creator.image">
            </figure>
        </section>
        <section id="idea" class="common_section">
            <article>
                <h1 data-i18n="about.idea.title"></h1>
                <p data-i18n="about.idea.description"></p>
            </article>
            <figure>
                <img src="./src/assets/images/content/dark_world_education.svg" data-i18n-alt="idea.image">
            </figure>
        </section>
        <section id="intitutions" class="common_section">
            <article>
                <h1 data-i18n="about.institutions.title"></h1>
                <p data-i18n="about.institutions.description"></p>
            </article>
            <figure>
                <img src="./src/assets/images/content/institutions.svg" data-i18n-alt="institutions.image">
            </figure>
        </section>
    </main>
    <footer-component></footer-component>
    <!-- Components -->
    <script src="./src/components/head.js"></script>
    <script src="./src/components/header.js"></script>
    <script src="./src/components/navbar.js"></script>
    <script src="./src/components/footer.js"></script>
    <!-- Statements -->
    <!-- Scripts to change the language -->
    <script src="./src/js/i18n.js"></script>
    <!-- Scripts to change the theme -->
    <script src="./src/js/theme.js"></script>
    <!-- Scripts to navbar -->
    <script src="./src/js/navbar.js"></script>
    <!-- Search Content -->
    <script src="./src/js/search.js"></script>
    <!-- Responsive Layout -->
    <script src="./src/js/move_elements.js"></script>
</body>
</html>
