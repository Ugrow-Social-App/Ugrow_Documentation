<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="contact.head.title">Contact</title>
    <link rel="icon" href="./public/favicon/favicon.svg" type="image/svg+xml">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./src/css/root.css">
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="stylesheet" href="./src/css/documentation_layout.css">
    <link rel="stylesheet" href="./src/css/contact_layout.css">
</head>
<body>
    <!-- Header Component -->
    <header-component></header-component>
    <main data-cy="contact_main-content">
        <!-- Contact Hero of website -->
        <section class="common_hero">
            <h1 data-i18n="contact.hero.title"></h1>
            <p data-i18n="contact.hero.subtitle"></p>
        </section>
        <div class="content">
            <!-- No aside here, contact page doesn't need in-page navigation -->
            <section id="contact_page_content" class="documentation_section">
                <article class="documentation_article">
                    <section id="contact">
                        <h1 data-i18n="contact.title"></h1>
                        <p data-i18n="contact.description"></p>
                        <form id="contact_form" method="post">
                            <span id="error_msg_contact_form" style="display: none;"></span>
                            <label for="input_email" data-i18n="contact.form.email_label"></label>
                            <input name="email" id="input_email">
                            <select name="type" id="problem_type_select">
                                <option value="" data-i18n="contact.form.problem_type_select.info" hidden></option>
                                <option value="feedback" data-i18n="contact.form.problem_type_select.feedback"></option>
                                <option value="problem" data-i18n="contact.form.problem_type_select.app_problem"></option>
                            </select>
                            <!-- Get the datetime -->
                            <input type="hidden" name="time" id="time">
                            <label for="input_message" data-i18n="contact.form.message_label"></label>
                            <textarea name="message" id="input_message" required></textarea>
                            <button id="btn-contact" type="submit" data-i18n="contact.form.btn"></button>
                        </form>
                    </section>
                </article>
                <article class="documentation_article" id="faq_article">
                    <h1 data-i18n="contact.faq.title"></h1>
                    <p data-i18n="contact.faq.subtitle"></p>
                    <div class="faq_list">
                        <div class="faq_item">
                            <button class="faq_question" type="button" aria-expanded="false" data-i18n="contact.faq.q1.question"></button>
                            <div class="faq_answer">
                                <p data-i18n="contact.faq.q1.answer"></p>
                            </div>
                        </div>
                        <div class="faq_item">
                            <button class="faq_question" type="button" aria-expanded="false" data-i18n="contact.faq.q2.question"></button>
                            <div class="faq_answer">
                                <p data-i18n="contact.faq.q2.answer"></p>
                            </div>
                        </div>
                        <div class="faq_item">
                            <button class="faq_question" type="button" aria-expanded="false" data-i18n="contact.faq.q3.question"></button>
                            <div class="faq_answer">
                                <p data-i18n="contact.faq.q3.answer"></p>
                            </div>
                        </div>
                        <div class="faq_item">
                            <button class="faq_question" type="button" aria-expanded="false" data-i18n="contact.faq.q4.question"></button>
                            <div class="faq_answer">
                                <p data-i18n="contact.faq.q4.answer"></p>
                            </div>
                        </div>
                        <div class="faq_item">
                            <button class="faq_question" type="button" aria-expanded="false" data-i18n="contact.faq.q5.question"></button>
                            <div class="faq_answer">
                                <p data-i18n="contact.faq.q5.answer"></p>
                            </div>
                        </div>
                    </div>
                </article>
            </section>
        </div>
    </main>
    <footer-component></footer-component>
    <!-- Components -->
    <script src="./src/components/header.js"></script>
    <script src="./src/components/navbar.js"></script>
    <script src="./src/components/footer.js"></script>
    <!-- Statements -->
    <!-- Scripts to change the language -->
    <script src="./src/js/i18n.js"></script>
    <!-- Scripts to change the theme -->
    <script src="./src/js/theme.js"></script>
    <!-- Scripts to navbar -->
    <script src="./src/js/navbar.js"></script>
    <!-- Search Content -->
    <script src="./src/js/search.js"></script>
    <!-- Responsive Layout -->
    <script src="./src/js/move_elements.js"></script>
    <!-- FAQ accordion interactivity -->
    <script src="./src/js/contact_faq.js"></script>
    <!-- API EmailJS and Form js -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="./src/config/email.config.js"></script>
    <script src="./src/api/email.js"></script>
    <script src="./src/js/contact_form.js"></script>
</body>
</html>
