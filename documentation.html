<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="documentation.head.title">Documentation</title>
    <link rel="icon" href="./public/favicon/favicon.svg" type="image/svg+xml">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="./src/css/root.css">
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="stylesheet" href="./src/css/documentation_layout.css">
</head>
<body>
    <!-- Header Component -->
    <header-component></header-component>
    <main data-cy="documentation_main-content">
        <!-- Documentation Hero of website -->
        <section class="common_hero">
            <h1 data-i18n="documentation.hero.title"></h1>
            <p data-i18n="documentation.hero.subtitle"></p>
        </section>
        <div class="content">
            <aside data-cy="aside" class="common_aside">
                <ul>
                    <li>
                        <a href="#overview_title" data-i18n="documentation.article.overview.title"></a>
                        <ul class="common_aside_sublist">
                            <li><a href="#overview_context" data-i18n="documentation.article.overview.subtitle_context"></a></li>
                            <li><a href="#overview_goal" data-i18n="documentation.article.overview.subtitle_goal"></a></li>
                            <li><a href="#overview_official_documents" data-i18n="documentation.article.standard.subtitle_official_documents"></a></li>
                        </ul>
                    </li>
                    <li>
                        <a href="#official_doc_title" data-i18n="documentation.article.official_doc.title"></a>
                        <ul class="common_aside_sublist">
                            <li><a href="#official_doc_github" data-i18n="documentation.article.official_doc.subtitle_github"></a></li>
                            <li><a href="#official_doc_documentation_repository" data-i18n="documentation.article.official_doc.subtitle_documentation.repository"></a></li>
                            <li><a href="#official_doc_timeline" data-i18n="documentation.article.official_doc.subtitle_timeline"></a></li>
                            <li><a href="#official_doc" data-i18n="documentation.article.standard.subtitle_official_documents"></a></li>
                        </ul>
                    </li>
                    <li>
                        <a href="#license_title" data-i18n="documentation.article.license.title"></a>
                        <ul class="common_aside_sublist">
                            <li><a href="#license_documentation_license" data-i18n="documentation.article.license.subtitle_documentation.license"></a></li>
                            <li><a href="#license_official_documents" data-i18n="documentation.article.standard.subtitle_official_documents"></a></li>
                        </ul>
                    </li>
                </ul>
            </aside>
            <!-- Documentation Section to brings informations about the project -->
            <section id="documentation" class="documentation_section">
                <article id="overview_article" class="documentation_article">
                    <h1 id="overview_title" data-i18n="documentation.article.overview.title"></h1>
                    <h2 id="overview_context" data-i18n="documentation.article.overview.subtitle_context"></h2>
                    <p data-i18n="documentation.article.overview.description_context"></p>
                    <h2 id="overview_goal" data-i18n="documentation.article.overview.subtitle_goal"></h2>
                    <p data-i18n="documentation.article.overview.description_goal"></p>
                    <h2 id="overview_official_documents" data-i18n="documentation.article.standard.subtitle_official_documents"></h2>
                    <p data-i18n="documentation.article.standard.description_official_documents"></p>
                    <ol>
                        <li>
                            <a 
                            href="https://github.com/Ugrow-Social-App/Ugrow_Documentation/blob/main/public/docs/project-overview/project-context.md" 
                            target="_blank" rel="noopener noreferrer"
                            data-i18n="documentation.article.overview.markdown_file_link">
                        </a></li>
                        <li>
                            <a 
                            href="./public/docs/project-overview/project-submission(pt-br).pdf" 
                            target="_blank" rel="noopener noreferrer"
                            data-i18n="documentation.article.overview.iceti_doc_link">
                        </a></li>
                    </ol>
                </article>
                <article id="official_doc_article" class="documentation_article">
                    <h1 id="official_doc_title" data-i18n="documentation.article.official_doc.title"></h1>
                    <h2 id="official_doc_subtitle_github" data-i18n="documentation.article.official_doc.subtitle_github"></h2>
                    <p data-i18n="documentation.article.official_doc.description_github"></p>
                    <h2 id="official_doc_subtitle_documentation_repository" data-i18n="documentation.article.official_doc.subtitle_documentation_repository"></h2>
                    <p data-i18n="documentation.article.official_doc.description_documentation_repository"></p>
                    <h2 id="official_doc_subtitle_timeline" data-i18n="documentation.article.official_doc.subtitle_timeline"></h2>
                    <p data-i18n="documentation.article.official_doc.description_timeline"></p>
                    <h2 id="official_documents" data-i18n="documentation.article.standard.subtitle_official_documents"></h2>
                    <p data-i18n="documentation.article.standard.description_official_documents"></p>
                    <ol>
                        <li>
                            <a 
                            href="https://github.com/Ugrow-Social-App" 
                            target="_blank" rel="noopener noreferrer"
                            data-i18n="documentation.article.official_doc.organization_link">
                        </a></li>
                        <li>
                            <a 
                            href="https://github.com/Ugrow-Social-App/Ugrow_Documentation" 
                            target="_blank" rel="noopener noreferrer"
                            data-i18n="documentation.article.official_doc.documentation.repository_link">
                        </a></li>
                        <li>
                            <a 
                            href="https://github.com/orgs/Ugrow-Social-App/projects/2" 
                            target="_blank" rel="noopener noreferrer"
                            data-i18n="documentation.article.official_doc.timeline_link">
                        </a></li>
                        <li>
                            <a 
                            href="https://github.com/Ugrow-Social-App/Ugrow_Documentation/blob/main/public/docs/user-manual/user-manual.md" 
                            target="_blank" rel="noopener noreferrer"
                            data-i18n="documentation.article.official_doc.manual_link">
                        </a></li>
                    </ol>
                </article>
                <article id="license_article" class="documentation_article">
                    <h1 id="license_title" data-i18n="documentation.article.license.title"></h1>
                    <h2 id="license_subtitle" data-i18n="documentation.article.license.subtitle_documentation_license"></h2>
                    <p data-i18n="documentation.article.license.description_documentation_license"></p>
                    <h2 id="license_official_documents" data-i18n="documentation.article.standard.subtitle_official_documents"></h2>
                    <p data-i18n="documentation.article.standard.description_official_documents"></p>
                    <ol>
                        <li>
                            <a 
                            href="https://github.com/Ugrow-Social-App/Ugrow_Documentation/blob/main/LICENSE" 
                            target="_blank" rel="noopener noreferrer"
                            data-i18n="documentation.article.license.license_link">
                        </a></li>
                    </ol>
                </article>
            </section>
        </div>
    </main>
    <footer-component></footer-component>
    <!-- Components -->
    <script src="./src/components/header.js"></script>
    <script src="./src/components/navbar.js"></script>
    <script src="./src/components/footer.js"></script>
    <!-- Statements -->
    <!-- Scripts to change the language -->
    <script src="./src/js/i18n.js"></script>
    <!-- Scripts to change the theme -->
    <script src="./src/js/theme.js"></script>
    <!-- Scripts to navbar -->
    <script src="./src/js/navbar.js"></script>
    <!-- Search Content -->
    <script src="./src/js/search.js"></script>
    <!-- Responsive Layout -->
    <script src="./src/js/move_elements.js"></script>
</body>
</html>
